[project]
name = "groundwork"
version = "0.1.0"
description = "UK company underwriting intelligence agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "anthropic>=0.40",
    "google-genai>=0.3",
    "langgraph>=0.2",
    "tavily-python>=0.5",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults. `Depends(...)` in a default is
# how FastAPI declares dependencies — it is the framework's intended idiom, not
# the mutable-default bug B008 exists to catch.
"src/api/*.py" = ["B008"]
