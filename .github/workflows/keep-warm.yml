# Keep-warm ping for the Cloud Run demo (TASKS.md 6.4a).
#
# Closes a Round 1 council finding: a cold container plus a 60-90s agent run
# could mean an evaluator's very first request takes minutes — the single worst
# moment for latency in the whole submission.
#
# It hits `/health`, which is unauthenticated by design precisely so this
# workflow needs no secret. A public workflow file that carried the demo token
# would be a worse problem than the cold start it was fixing.
#
# **This reduces cold starts. It does not eliminate them, and the README says
# so with a measured number.** Two honest limits:
#
#   1. GitHub's scheduled workflows are best-effort and are routinely delayed
#      past their cron time under platform load — a 10-minute schedule is not a
#      10-minute guarantee.
#   2. Scheduled workflows are disabled automatically after 60 days of repo
#      inactivity.
#
# Cloud Scheduler would be more reliable and is free at this volume. It was
# rejected for this window: it means enabling another API and another IAM
# binding on submission eve, to improve a mitigation whose failure mode is
# already measured and disclosed.

name: keep-warm

on:
  schedule:
    # Every 10 minutes — inside Cloud Run's idle-instance window, so a warm
    # container is generally still alive when the next ping lands.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          # --max-time generously above a cold start: the point of this job is
          # to *absorb* one, not to fail on it.
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 120 \
            https://groundwork-213351312105.europe-west2.run.app/health)
          echo "HTTP $code"
          cat /tmp/health.json
          # Fail loudly on a non-200. A keep-warm job that goes green while the
          # service is down is worse than no job at all — it would be the one
          # thing still reporting healthy.
          test "$code" = "200"
